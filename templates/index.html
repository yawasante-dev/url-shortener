<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #6c63ff;
        }

        button {
            padding: 0.9rem 1.5rem;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #574fd6;
        }

        .result {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            display: none;
        }

        .result p {
            color: #888;
            margin-bottom: 0.5rem;
        }

        .short-url {
            color: #6c63ff;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 0.8rem;
            background: #333;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }

        .copy-btn:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚡ URL Shortener</h1>
        <p class="subtitle">Paste a long link, get a short one instantly</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com/very/long/url" />
            <button onclick="shortenURL()">Shorten</button>
        </div>

        <div class="result" id="result">
            <p>Your short link:</p>
            <a class="short-url" id="shortUrl" href="#" target="_blank"></a>
            <br>
            <button class="copy-btn" onclick="copyURL()">Copy Link</button>
        </div>
    </div>

    <script>
        async function shortenURL() {
            const url = document.getElementById('urlInput').value;
            if (!url) return;

            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();
            const shortUrl = data.short_url;

            document.getElementById('shortUrl').href = shortUrl;
            document.getElementById('shortUrl').textContent = shortUrl;
            document.getElementById('result').style.display = 'block';
        }

        function copyURL() {
            const url = document.getElementById('shortUrl').textContent;
            navigator.clipboard.writeText(url);
            alert('Copied!');
        }
    </script>
</body>

</html>
